name: Lighthouse on slow 3G
# Manual: Lighthouse on a low-end Android phone over slow 3G, the working rules' first design target.
# Runs on GitHub's runners, where timing is not disturbed by other work on a local machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow3g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only, without --with-deps: the runner image already has the system libraries, so nothing goes through apt
      # and an Ubuntu mirror outage can't block the run. The browser download is cached per Playwright version.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: LH_PROFILE=slow3g pnpm lighthouse

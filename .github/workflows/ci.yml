name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y poppler-utils
      # Fetch INEC's PDFs so extraction tests run against the real files (they are never committed, D-005).
      # The full `make verify-data` also needs the ~2 h polling-unit crawl and is run locally before each phase closes.
      - run: make fetch
      - run: make test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm test:site
      - run: pnpm test:e2e
      - run: pnpm size
      - run: pnpm lighthouse

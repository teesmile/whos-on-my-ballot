name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # poppler-utils gives the pipeline its independent second extractor (`pdftotext`), so it truly needs apt. The packages are
      # cached for this runner image; on a miss, apt runs with retries and a backoff (switching to a second mirror on another
      # domain from the third try), and the downloaded packages are saved for the next run.
      - id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-poppler-${{ steps.image.outputs.name }}
      - name: Install poppler-utils (cached, else apt with retries)
        run: |
          D="$HOME/apt-debs"
          if compgen -G "$D/*.deb" > /dev/null && sudo dpkg -i "$D"/*.deb && pdftotext -v; then exit 0; fi
          mkdir -p "$D/partial"
          APT="sudo apt-get -q -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true -o Dir::Cache::Archives=$D"
          for i in 1 2 3 4 5; do
            # From the third try, a mirror on another domain, in case *.ubuntu.com itself can't be reached (seen 11 Nov 2026).
            if [ "$i" -eq 3 ]; then
              sudo sed -i -E 's#https?://([a-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' \
                /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            fi
            if $APT update && $APT install -y poppler-utils && pdftotext -v; then
              sudo rm -rf "$D/partial" "$D/lock"; sudo chown -R "$USER" "$D"; exit 0
            fi
            echo "apt attempt $i failed; retrying in $((i * 30)) s"; sleep $((i * 30))
          done
          exit 1
      # Fetch INEC's PDFs so extraction tests run against the real files (they are never committed, D-005).
      # The full `make verify-data` also needs the ~2 h polling-unit crawl and is run locally before each phase closes.
      - run: make fetch
      - run: make test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium, and Firefox for the scroll-in motion's tests, without --with-deps: the runner image already has the system
      # libraries, so nothing goes through apt and an Ubuntu mirror outage can't block the run. The downloads are cached.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ff-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install chromium firefox
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm test:site
      # When a card snapshot test fails, keep the new cards so they can be looked at and, if right, committed as fixtures.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-cards
          path: |
            out/cards/site.png
            out/cards/jan-2027-president.png
            out/cards/jan-2027-house-fct-municipal-bwari.png
            out/cards/jan-2027-house-lagos-eti-osa.png
            out/cards/jan-2027-house-osun-atakunmosa-east-atakunmosa-west-ilesha-east-ilesha-west.png
            out/cards/jan-2027-house-kwara-ilorin-east-ilorin-south.png
            out/cards/jan-2027-house-niger-chanchaga.png
            out/cards/feb-2027-governor-taraba.png
            out/cards/feb-2027-sha-kwara-kaiama-wajibe-kemanji-kaiama-ii.png
            out/cards/feb-2027-sha-lagos-lagos-island-i.png
      - run: pnpm test:e2e
      - run: pnpm size
      - run: pnpm lighthouse

# Reviewed sources for presidential background (D-013, D-026).
#
# RULE: an outlet owned by, or closely tied to, any candidate or party does not count for that candidate's ticket.
#   tied_to_parties: party acronyms; the outlet doesn't count for that party's presidential ticket.
#   tied_to_people:  presidential ticket ids (jan-2027-president-<acronym>) whose candidate or running mate owns or founded it.
# Ownership notes record why. Ties are recorded from the outlets' publicly known ownership as of Nov 2026 and are part of the
# owner's Launch A review. Add a source only after checking who owns it; an unlisted host fails the build.
sources:
  # --- official records (second pass, D-026)
  inec:          {hosts: [inecnigeria.org, www.inecnigeria.org], publisher: Independent National Electoral Commission (INEC), kind: official,
                  ownership: "the independent electoral commission; its published records", tied_to_parties: [], tied_to_people: []}
  nass:          {hosts: [nass.gov.ng, www.nass.gov.ng], publisher: National Assembly of Nigeria, kind: official,
                  ownership: "the legislature's own membership records", tied_to_parties: [], tied_to_people: []}
  # --- news organisations
  businessday:   {hosts: [businessday.ng], publisher: BusinessDay, kind: news, ownership: "BusinessDay Media Ltd, privately owned", tied_to_parties: [], tied_to_people: []}
  dailytrust:    {hosts: [dailytrust.com], publisher: Daily Trust, kind: news, ownership: "Media Trust Ltd, privately owned", tied_to_parties: [], tied_to_people: []}
  guardian-ng:   {hosts: [guardian.ng], publisher: The Guardian Nigeria, kind: news, ownership: "Guardian Newspapers Ltd, privately owned", tied_to_parties: [], tied_to_people: []}
  leadership:    {hosts: [leadership.ng], publisher: Leadership, kind: news,
                  ownership: "Leadership Group Ltd; founded by Sam Nda-Isaiah (d. 2020), an APC founding member and 2015 presidential aspirant",
                  tied_to_parties: [APC], tied_to_people: []}
  nairametrics:  {hosts: [nairametrics.com], publisher: Nairametrics, kind: news, ownership: "privately owned financial news site", tied_to_parties: [], tied_to_people: []}
  nan:           {hosts: [nannews.ng], publisher: News Agency of Nigeria, kind: news,
                  ownership: "federal government news agency, under the APC-led federal government", tied_to_parties: [APC], tied_to_people: []}
  newtelegraph:  {hosts: [newtelegraphng.com], publisher: New Telegraph, kind: news,
                  ownership: "owned by Orji Uzor Kalu, an APC senator", tied_to_parties: [APC], tied_to_people: []}
  pmnews:        {hosts: [pmnewsnigeria.com], publisher: P.M. News, kind: news,
                  ownership: "Independent Communications Network Ltd; co-founded by Bayo Onanuga, adviser to President Tinubu",
                  tied_to_parties: [APC], tied_to_people: [jan-2027-president-apc]}
  saharareporters: {hosts: [saharareporters.com], publisher: Sahara Reporters, kind: news,
                  ownership: "founded by Omoyele Sowore, the AAC presidential candidate and AAC founder",
                  tied_to_parties: [AAC], tied_to_people: [jan-2027-president-aac]}
  thewill:       {hosts: [thewillnews.com], publisher: The Will, kind: news, ownership: "privately owned", tied_to_parties: [], tied_to_people: []}
  thisday:       {hosts: [thisdaylive.com, www.thisdaylive.com], publisher: ThisDay, kind: news, ownership: "Leaders & Company Ltd, privately owned", tied_to_parties: [], tied_to_people: []}
  voa:           {hosts: [voaafrica.com, www.voaafrica.com], publisher: Voice of America, kind: news, ownership: "US government international broadcaster", tied_to_parties: [], tied_to_people: []}
  von:           {hosts: [von.gov.ng], publisher: Voice of Nigeria, kind: news,
                  ownership: "federal government broadcaster, under the APC-led federal government", tied_to_parties: [APC], tied_to_people: []}
  arise:         {hosts: [www.arise.tv, arise.tv], publisher: Arise News, kind: news, ownership: "Arise Media Group, privately owned", tied_to_parties: [], tied_to_people: []}
  channels:      {hosts: [www.channelstv.com, channelstv.com], publisher: Channels Television, kind: news, ownership: "Channels Incorporated, privately owned", tied_to_parties: [], tied_to_people: []}
  icir:          {hosts: [www.icirnigeria.org, icirnigeria.org], publisher: The ICIR, kind: news, ownership: "International Centre for Investigative Reporting, non-profit", tied_to_parties: [], tied_to_people: []}
  thecable:      {hosts: [www.thecable.ng, thecable.ng], publisher: TheCable, kind: news, ownership: "Cable Newspaper Ltd, privately owned", tied_to_parties: [], tied_to_people: []}
  vanguard:      {hosts: [www.vanguardngr.com, vanguardngr.com], publisher: Vanguard, kind: news, ownership: "Vanguard Media Ltd, privately owned", tied_to_parties: [], tied_to_people: []}

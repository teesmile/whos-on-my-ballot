# Registry of every input. `fetch` downloads each document, hashes it and writes data/generated/sources.json.
# Press pages are read to discover their document links, so the exact file URLs and hashes are recorded at fetch time.
# Facts are cited to INEC's own URLs; archive copies are used only where INEC's URL is gone (D-016).

press_pages:
  - id: presidential
    race: president
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-2027-presidential-election
    title: "INEC: Updated list of candidates for 2027 Presidential election (31 Oct 2026)"
    expect_documents: 1
  - id: senate
    race: senate
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-2027-senatorial-district-elections
    title: "INEC: Updated list of candidates for 2027 Senatorial District elections (31 Oct 2026)"
    expect_documents: 37
  - id: house
    race: house
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-jan-2027-national-assembly-elections
    title: "INEC: Updated list of candidates for Jan 2027 National Assembly elections (31 Oct 2026)"
    expect_documents: 36   # Niger is missing from INEC's 31 Oct set (OI-1); see fallbacks

  - id: governorship
    race: governor
    election: feb-2027
    url: https://www.inecnigeria.org/press/updated-final-list-of-candidates-for-2027-governorship-election
    title: "INEC: Updated final list of candidates for 2027 Governorship election (31 Oct 2026)"
    expect_documents: 28   # 36 states less the 8 off-cycle states; the FCT has no governor

index_page: https://www.inecnigeria.org/elections/2027-general-elections-update

documents:
  # OI-1: the only INEC House list for Niger is in the 12 Sep 2026 consolidated PDF. Only NIGER rows are used.
  - id: house-2026-09-12-consolidated
    race: house
    election: jan-2027
    url: "https://www.inecnigeria.org/documents/press/2027%20REPS%20FINAL%20LIST%20OF%20CANDIDATES.pdf"
    title: "INEC: Final list of candidates, House of Representatives (12 Sep 2026)"
    use_states: [NIGER]
    sn_per_state: true
  - id: sha-2026-10-10
    race: state_assembly
    election: feb-2027
    url: "https://www.inecnigeria.org/documents/2027%20FINAL%20LIST%20-%20STATE%20HOUSES%20OF%20ASSEMBLY%20(1).pdf"
    page_url: https://www.inecnigeria.org/press/final-list-of-candidates-for-2027-state-houses-of-assembly-elections
    title: "INEC: Final list of candidates for 2027 State Houses of Assembly elections (statutory notice, 31 Oct 2026)"
    sn_per_state: true   # serial numbers restart in each state
  # Reference document (D-034): the four-year terms cited under the civic note. Hashed and watched; not extracted.
  - id: constitution-1999
    kind: reference
    url: "https://nigeriareposit.nln.gov.ng/server/api/core/bitstreams/b62fb209-2716-48c4-b277-f684ca18d29d/content"
    page_url: https://nigeriareposit.nln.gov.ng/items/399df25a-52d0-4972-9365-c618cd3ddf5f
    title: "Constitution of the Federal Republic of Nigeria 1999 (Federal Government Press), National Library of Nigeria"
  - id: inec-constituencies-workbook
    kind: workbook
    url: "https://web.archive.org/web/20260815145133id_/https://inecnigeria.org/wp-content/uploads/2019/02/Name-of-Senatorial-DistrictsFederal-and-State-Constituencies-Nationwide-1.xls"
    cite_url: "https://inecnigeria.org/wp-content/uploads/2019/02/Name-of-Senatorial-DistrictsFederal-and-State-Constituencies-Nationwide-1.xls"
    archive_url: "https://web.archive.org/web/20260815145133/https://inecnigeria.org/downloads-all/name-of-senatorial-districts-federal-and-state-constituencies-nationwide/"
    title: "INEC: Name of Senatorial Districts, Federal and State Constituencies Nationwide (workbook)"
  - id: inec-voter-education
    kind: html
    url: https://www.inecnigeria.org/voters/education
    title: "INEC: Voter Education & Guidelines (election-day voting procedure)"
  - id: inec-calendar
    kind: html
    url: https://www.inecnigeria.org/elections/calendar
    title: "INEC: Election Calendar & Timetable"
  - id: inec-parties
    kind: html
    url: https://www.inecnigeria.org/parties
    title: "INEC: Registered political parties"

polling_units:
  id: inec-pu-locator
  url: https://cvr.inecnigeria.org/pu
  title: "INEC: Polling Unit Locator"
  official_total: 176846          # INEC's published figure; the crawl count is reconciled against it (OI-7)
  official_wards: 8809
  official_lgas: 774
  # D-020 (owner sign-off pending): the crawl must reproduce exactly these counts. A truncated response or any INEC
  # change to the locator fails verification until a person reviews the difference and updates this baseline.
  locator_baseline:
    wards: 8838        # after dropping the empty duplicate of Gwer East ward 09
    pus: 177299
    crawled: 2026-11-09

# Phase 5 must not change the 16 January data: races/jan-2027.json must keep this SHA-256 (as merged to main after Phase 4).
# Update it only deliberately, when INEC changes the 16 January lists.
jan_2027_sha256: 883305aaee25c257132a30c745972ccc18df11b6253173d7618719e654ccf171   # re-pinned 10 Nov 2026 after the launch background review (review 7, D-037): neutral citations, plain hyphens, independent sources

# The eight states whose governorship elections are off-cycle (and the FCT, which has no governor): no 6 February race.
off_cycle_governorship: [ANAMBRA, BAYELSA, EDO, EKITI, IMO, KOGI, ONDO, OSUN]

# OI-5: each state's count of State Assembly constituencies on INEC's 2027 list minus the count in INEC's constituency workbook.
# The 2027 list names constituencies the workbook does not have (for example DELTA "ANIOCHA NORTH II", KOGI "YAGBA WEST II"),
# and has no Borno list (OI-11). Any other difference fails verify.
sha_count_vs_workbook:
  BENUE: 8
  BORNO: -28
  DELTA: 9
  JIGAWA: 1
  KOGI: 11

# INEC's Result Viewing Portal: which 2023 State Assembly constituency each ward was in (D-030). Cached by `crawl-irev`.
irev:
  id: inec-irev-2023-assembly
  title: "INEC Result Viewing Portal (IReV): wards of each State House of Assembly constituency, 18 March 2023 elections"
  url: https://www.inecelectionresults.ng

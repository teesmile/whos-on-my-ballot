# Registry of every input. `fetch` downloads each document, hashes it and writes data/generated/sources.json.
# Press pages are read to discover their document links, so the exact file URLs and hashes are recorded at fetch time.
# Facts are cited to INEC's own URLs; archive copies are used only where INEC's URL is gone (D-016).

press_pages:
  - id: presidential
    race: president
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-2027-presidential-election
    title: "INEC: Updated list of candidates for 2027 Presidential election (31 Oct 2026)"
    expect_documents: 1
  - id: senate
    race: senate
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-2027-senatorial-district-elections
    title: "INEC: Updated list of candidates for 2027 Senatorial District elections (31 Oct 2026)"
    expect_documents: 37
  - id: house
    race: house
    election: jan-2027
    url: https://www.inecnigeria.org/press/updated-list-of-candidates-for-jan-2027-national-assembly-elections
    title: "INEC: Updated list of candidates for Jan 2027 National Assembly elections (31 Oct 2026)"
    expect_documents: 36   # Niger is missing from INEC's 31 Oct set (OI-1); see fallbacks

index_page: https://www.inecnigeria.org/elections/2027-general-elections-update

documents:
  # OI-1: the only INEC House list for Niger is in the 12 Sep 2026 consolidated PDF. Only NIGER rows are used.
  - id: house-2026-09-12-consolidated
    race: house
    election: jan-2027
    url: "https://www.inecnigeria.org/documents/press/2027%20REPS%20FINAL%20LIST%20OF%20CANDIDATES.pdf"
    title: "INEC: Final list of candidates, House of Representatives (12 Sep 2026)"
    use_states: [NIGER]
  - id: inec-constituencies-workbook
    kind: workbook
    url: "https://web.archive.org/web/20260815145133id_/https://inecnigeria.org/wp-content/uploads/2019/02/Name-of-Senatorial-DistrictsFederal-and-State-Constituencies-Nationwide-1.xls"
    cite_url: "https://inecnigeria.org/wp-content/uploads/2019/02/Name-of-Senatorial-DistrictsFederal-and-State-Constituencies-Nationwide-1.xls"
    archive_url: "https://web.archive.org/web/20260815145133/https://inecnigeria.org/downloads-all/name-of-senatorial-districts-federal-and-state-constituencies-nationwide/"
    title: "INEC: Name of Senatorial Districts, Federal and State Constituencies Nationwide (workbook)"
  - id: inec-voter-education
    kind: html
    url: https://www.inecnigeria.org/voters/education
    title: "INEC: Voter Education & Guidelines (election-day voting procedure)"
  - id: inec-calendar
    kind: html
    url: https://www.inecnigeria.org/elections/calendar
    title: "INEC: Election Calendar & Timetable"
  - id: inec-parties
    kind: html
    url: https://www.inecnigeria.org/parties
    title: "INEC: Registered political parties"

polling_units:
  id: inec-pu-locator
  url: https://cvr.inecnigeria.org/pu
  title: "INEC: Polling Unit Locator"
  official_total: 176846          # INEC's published figure; the crawl count is reconciled against it (OI-7)
  official_wards: 8809
  official_lgas: 774
  # D-020 (owner sign-off pending): the crawl must reproduce exactly these counts. A truncated response or any INEC
  # change to the locator fails verification until a person reviews the difference and updates this baseline.
  locator_baseline:
    wards: 8838        # after dropping the empty duplicate of Gwer East ward 09
    pus: 177299
    crawled: 2026-11-09

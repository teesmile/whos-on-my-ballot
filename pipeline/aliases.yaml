# Workbook composition text the rules can't read. Each entry names the source file and row, quotes INEC's text exactly
# (the build rejects the entry if the current workbook text differs) and says how it was read.
# The global check (every LGA in exactly one senatorial district and one federal constituency) backs every entry.
composition_overrides:
  FC/008/AB:
    source_id: inec-constituencies-workbook
    row: 13
    workbook_text: "The entire Geographical Areas of Ukwa East and East L.G.As"
    reading: "'East and East' is a typo; the constituency name is Ukwa East/Ukwa West"
    lgas: [UKWA EAST, UKWA WEST]
  SD/050/JG:
    source_id: inec-constituencies-workbook
    row: 118
    workbook_text: "AUYO, BIRNIWA, GURI, HADEJIA, KAUGAMA, K/HAUSA, K/KASAMMA, M/MADORI"
    reading: "abbreviations K/ = Kafin, Kirika; M/ = Malam"
    lgas: [AUYO, BIRNIWA, GURI, HADEJIA, KAUGAMA, KAFIN HAUSA, KIRIKA SAMMA, MALAM MADORI]
  SD/051/JG:
    source_id: inec-constituencies-workbook
    row: 119
    workbook_text: "BABURA, GAGARA, GARKI, GWIWA, KAZAURE, MAIGATAR, RONI, RINGIN, S/TANKAR, TAURA, YANKWASHI, GUME"
    reading: "S/TANKAR = Sule-Tankarkar; truncated spellings"

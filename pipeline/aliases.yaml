# Reviewed, explicit links between INEC documents whose spellings differ. Never fuzzy-matched.
# Every entry names the INEC text on both sides so a reviewer can check it against the sources.

# "<STATE>|<name on INEC candidate list>": "<name in INEC constituency workbook (FED. CONST. / SEN. DIST. sheet)>"
constituency_aliases:
  "ADAMAWA|FUFORE/SONG": "Furore/Song"   # workbook spelling; Fufore is the LGA
  "BAUCHI|ALKALERI/KERFI": "Alkaleri/Kirfi"
  "BAUCHI|DARAZO/GANJUWA": "Darazo/Gunjuwa"
  "BAUCHI|MISAU/DAMBAN": "Misau/Dambam"
  "BENUE|Ado/Ogbadigbo/Okpokwu": "Ado/Obadigbo/Okpokwu"
  "DELTA|Ndokwa East/Ndokwa West/Ukwuani": "Nkokwa East/Ndokwa West/ Ukwuani"
  "JIGAWA|Hadejia/Kafin Hausa/Auyo": "Hadejia/Kafin Hausa"   # workbook name omits Auyo; composition checked in geo
  "KANO|Albasu/Gaya/Ajingi": "Alabasu/Gaya/Ajingi"
  "KANO|GWARZO/KABO": "Gwarzo/Ikabo"
  "RIVERS|ANDONI-OPOBO/NKORO": "Opobo/Nkoro/Andoni"

# Spellings in INEC's constituency workbook -> the LGA name in INEC's polling-unit locator.

    reading: "DAWAKIN = Dawakin Tofa; KUNCHI = Ghari"
    lgas: [BICHI, SHANONO, BAGWAI, DANBATA, MAKODA, DAWAKI TOFA, GABASAWA, GWARZO, KABO, RIMIN GADO, TOFA, TSANYAWA, GHARI, KARAYE]

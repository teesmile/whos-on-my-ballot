    lgas: [DALA, GWALE, DAWAKI KUDU, GEZAWA, TARAUNI, FAGGE, GARUN MALAM, KANO MUNICIPAL, KUMBOTSO, KURA, MADOBI, MINJIBIR, NASARAWA, UNGOGO, WARAWA]

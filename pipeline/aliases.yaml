# Shown on the race wherever it appears (owner ruling D-021). `inec_text` must equal the workbook row's text.
placement_notes:
  - unit: FC/101/ED
    lga: ESAN WEST
    kind: inferred
    source_id: inec-constituencies-workbook
    row: 368
    inec_text: "The entire Geographical Area of Esan Central/Esan South/Igueben L.G.As"
    reason: >-
      INEC's text names an "Esan South" LGA, which does not exist. Esan West is the only Edo LGA that INEC places in no other
      federal constituency, so its polling units are placed here.
  - unit: SD/078/NG
    lga: GBAKO
    kind: inferred
    source_id: inec-constituencies-workbook
    row: 188
    inec_text: "AGAIE, BIDA, KATCHA, BATAGI, LAPAI, LAVUN, EDATI-IDATI, MOKWA"
    reason: >-
      INEC's list of LGAs for this district includes "BATAGI", which is not an LGA. Gbako is the only Niger LGA that INEC places in
      no senatorial district, so its polling units are placed here.
  - unit: SD/054/KD
    lga: KAURU
    kind: inferred
    source_id: inec-constituencies-workbook
    row: 129
    inec_text: "JEMA’A, JABA, KAURA, ZANGON, KAURA, KACHIA, KAGARKO, SANGA"
    reason: >-
      INEC's list names Kaura twice. Kauru is the only Kaduna LGA that INEC places in no senatorial district, so the second "Kaura"
      is read as Kauru and its polling units are placed here.
  - unit: FC/145/JG
    lga: AUYO
    kind: inferred
    source_id: inec-constituencies-workbook
    row: 549
    inec_text: "The entire Geographical Area of Hadejia/Kafin Hausa L.G.As"
    reason: >-
      INEC's constituency workbook places Auyo in no federal constituency. INEC's 31 October 2026 House list names this constituency
      "Hadejia/Kafin Hausa/Auyo", so Auyo's polling units are placed here.
  - unit: SD/006/AD
    lga: HONG
    kind: unconfirmed
    source_id: inec-constituencies-workbook
    row: 19
    inec_text: "HONG, FUFORE, SONG, YOLA NORTH, YOLA SOUTH, GERFI"
    reason: >-
      INEC's workbook places Hong in this district. This is INEC's own placement and has not been confirmed against another INEC source.

# State constituencies whose LGA INEC's workbook doesn't make plain (Phase 5, D-028). Each quotes the workbook's text and
# says what places it. `kind: remainder` = the LGA's wards that no other constituency claims. The build checks every one.
state_constituency_overrides:
  SC/03/AB: {workbook_text: "Part of the LGA", lgas: [ABA NORTH, ABA SOUTH],
             reading: "Aba Central's neighbours Aba North and Aba South are also 'Part of the LGA'; INEC names neither the LGA nor the wards, so the wards of both LGAs list all three Aba constituencies (OI-6)."}
  SC/107/BA: {workbook_text: "Ward 06 – 10", lgas: [ALKALERI],
              reading: "Alkaleri is the LGA with a ward named GWANA / MANSUR; the sheet's previous constituency, PALI (wards 01 – 05), is also in Alkaleri."}
  SC/120/BA: {workbook_text: "Ward 02 & 09 – 12", lgas: [MISAU], reading: "Misau is the only Bauchi LGA with a ward named HARDAWA."}
  SC/130/BA: {workbook_text: "Ward 01, 07 & 10 – 13", lgas: [SHIRA], reading: "Shira is the only Bauchi LGA with a ward named DISINA."}
  SC/133/BA: {workbook_text: "The entire LGA", lgas: [KATAGUM], kind: remainder,
              reading: "Azare is Katagum's headquarters; Katagum's other constituency, MADARA/CHINADE, is given wards 05 – 11, so Azare takes the Katagum wards no other constituency claims."}
  SC/135/BA: {workbook_text: "Ward 01 – 04", lgas: [GAMAWA], reading: "Gamawa is the only Bauchi LGA with a ward named UDUBO."}
  SC/476/KD: {workbook_text: "4 RAS OF BASAWA", lgas: [SABON GARI], reading: "Sabon Gari is the only Kaduna LGA with a ward named BASAWA."}
  SC/466/KD: {workbook_text: "SHABA GAJI UNG LIMAN, MAIBURI,GABASAWA, KABALA, UNG SARKI", lgas: [KADUNA NORTH],
              reading: "Two of the listed wards, GABASAWA and KABALA (KABALA COSTAIN/ DOKI), are Kaduna North wards; no other LGA has either."}
  SC/452/KD: {workbook_text: "8 RAS OF KAKANGI", lgas: [BIRNIN GWARI],
              reading: "Birnin Gwari and Giwa both have a ward named KAKANGI. Giwa's wards are already split between GIWA EAST and GIWA WEST, so Kakangi is read as Birnin Gwari's; the build checks that the wards left there number 8."}
  SC/468/KD: {workbook_text: "7 RAS OF DOKA/GABASAWA", lgas: [KADUNA SOUTH],
              reading: "The constituency is MAKERA, a Kaduna South ward. The text's DOKA/GABASAWA are Kaduna North wards already listed for DOKA, so the name is followed; its wards stay unresolved among Kaduna South's count-only constituencies."}
  SC/467/KD: {workbook_text: "4 RAS OFTUDUN WADA", lgas: [KADUNA SOUTH],
              reading: "Kaduna South has three wards named TUDUN WADA (NORTH, SOUTH, WEST); Makarfi and Zaria each have one. Read as Kaduna South with UNGUWAR SANUSI and MAKERA; wards stay unresolved among them."}
  SC/492/KN: {workbook_text: "The entire LGA", lgas: [DANBATA], reading: "DAMBATTA is the workbook's spelling of Danbata LGA (the federal constituency 'Dambatta/Makoda')."}
  SC/737/OG: {workbook_text: "", lgas: [IJEBU NORTH EAST], kind: entire,
              reading: "The workbook gives no composition; the constituency is named after Ijebu North East LGA, which has no other constituency."}
  SC/739/OG: {workbook_text: "SURULERE, ISOTE, SIWMAWA/IWELEPE, EGBOWA, IBIDO/ITUN/ALARA", lgas: [SAGAMU],
              reading: "Four of the five listed wards are Sagamu wards (SURULERE, ISOTE, SIMAWA / IWELEPE, IBIDO/ITUWA/ALARA)."}
  SC/772/OD: {workbook_text: "12 RAS OF ESE LGAS", lgas: [OSE],
              reading: "Not Ese Odo, which is its own constituency ('10 RAS OF ESE ODO LGAS'). Ose is the Ondo LGA with 12 wards; the build checks the count."}
  SC/928/TR: {workbook_text: "Ward 02, 04, 05 & 07 – 11", lgas: [USSA], reading: "Named after Ussa LGA."}
  SC/939/TR: {workbook_text: "The entire LGA", lgas: [DONGA], reading: "DONDA is the workbook's spelling of Donga LGA."}
  SC/470/KD: {workbook_text: "11 RAS OF KAURA", lgas: [KAURU],
              reading: "The constituency is CHAWAI/KAURU. 'KAURA' is the same Kaura-for-Kauru slip as in INEC's senatorial list (D-018); Kaura has its own constituency ('10 RAS OF KAURA') and Kauru has exactly 11 wards."}
  SC/29/AD: {workbook_text: "GENGLE,M/BELWA,", lgas: [DEMSA], kind: entire,
